<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartRoad AI - IoT Pothole & Road Bump Detection System</title>
    <meta name="description" content="Monitor road conditions in real time using ESP32, ultrasonic sensing, GPS location tracking, live camera feed, and AI cloud monitoring." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            },
            colors: {
              brand: {
                50: '#f0f9ff',
                500: '#06b6d4',
                600: '#0891b2',
                900: '#0b0f19',
              }
            },
            boxShadow: {
              'glow-cyan': '0 0 20px rgba(6, 182, 212, 0.35)',
              'glow-danger': '0 0 20px rgba(239, 68, 68, 0.35)',
              'glow-warning': '0 0 20px rgba(245, 158, 11, 0.35)',
            }
          }
        }
      }
    </script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- React & React DOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone for JSX processing in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      body {
        background-color: #0B0F19;
        color: #f8fafc;
        font-family: 'Inter', sans-serif;
      }
      .glass-card {
        background: linear-gradient(135deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }
      .glass-card:hover {
        border-color: rgba(56, 189, 248, 0.3);
        box-shadow: 0 8px 32px 0 rgba(0, 240, 255, 0.12);
      }
      .glow-text-cyan {
        text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
      }
      .status-dot-pulse {
        position: relative;
      }
      .status-dot-pulse::after {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        border-radius: 9999px;
        background: inherit;
        opacity: 0.75;
        animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      @keyframes pulse-ring {
        0% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.6); opacity: 0; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      .custom-leaflet-marker, .custom-device-marker {
        background: transparent !important;
        border: none !important;
      }
      .leaflet-container {
        background-color: #0d1322 !important;
        border-radius: 0.75rem;
      }
      .leaflet-popup-content-wrapper {
        background: rgba(15, 23, 42, 0.95) !important;
        backdrop-filter: blur(12px);
        color: #f8fafc !important;
        border: 1px solid rgba(56, 189, 248, 0.3);
        border-radius: 0.75rem !important;
      }
      .leaflet-popup-tip {
        background: rgba(15, 23, 42, 0.95) !important;
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0B0F19; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #06B6D4; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useMemo } = React;

      // Mock Initial Data
      const INITIAL_DEVICES = [
        {
          id: 'dev-001',
          deviceId: 'ESP32-ROAD-001',
          name: 'Bicycle Patrol Unit Alpha',
          status: 'ONLINE',
          latitude: 26.7271,
          longitude: 88.3953,
          batteryLevel: 94,
          wifiSignal: 88,
          gpsStatus: 'CONNECTED',
          cameraStatus: 'CONNECTED',
          gsmStatus: 'CONNECTED',
          ultrasonicStatus: 'CONNECTED',
          buzzerStatus: 'INACTIVE',
          firmwareVersion: 'v2.4.1',
          lastSeen: new Date().toISOString()
        },
        {
          id: 'dev-002',
          deviceId: 'ESP32-ROAD-002',
          name: 'Motorcycle Patrol Unit Beta',
          status: 'ONLINE',
          latitude: 26.7310,
          longitude: 88.3990,
          batteryLevel: 78,
          wifiSignal: 92,
          gpsStatus: 'CONNECTED',
          cameraStatus: 'CONNECTED',
          gsmStatus: 'CONNECTED',
          ultrasonicStatus: 'CONNECTED',
          buzzerStatus: 'INACTIVE',
          firmwareVersion: 'v2.4.1',
          lastSeen: new Date().toISOString()
        },
        {
          id: 'dev-003',
          deviceId: 'ESP32-ROAD-003',
          name: 'Highway Inspection Gamma',
          status: 'OFFLINE',
          latitude: 26.7190,
          longitude: 88.3880,
          batteryLevel: 15,
          wifiSignal: 0,
          gpsStatus: 'DISCONNECTED',
          cameraStatus: 'DISCONNECTED',
          gsmStatus: 'DISCONNECTED',
          ultrasonicStatus: 'DISCONNECTED',
          buzzerStatus: 'INACTIVE',
          firmwareVersion: 'v2.3.0',
          lastSeen: new Date(Date.now() - 3600000 * 3).toISOString()
        }
      ];

      const SAMPLE_IMAGES = [
        'https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?auto=format&fit=crop&w=800&q=80',
        'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=800&q=80',
        'https://images.unsplash.com/photo-1494783367193-149034c05e8f?auto=format&fit=crop&w=800&q=80',
        'https://images.unsplash.com/photo-1506521781263-d8422e82f27a?auto=format&fit=crop&w=800&q=80'
      ];

      const INITIAL_DETECTIONS = [
        {
          id: 'det-101',
          deviceId: 'ESP32-ROAD-001',
          type: 'POTHOLE',
          severity: 'CRITICAL',
          confidence: 96,
          distance: 58.4,
          latitude: 26.7285,
          longitude: 88.3962,
          imageUrl: SAMPLE_IMAGES[0],
          timestamp: new Date(Date.now() - 900000).toISOString(),
          status: 'ACTIVE'
        },
        {
          id: 'det-102',
          deviceId: 'ESP32-ROAD-001',
          type: 'ROAD_BUMP',
          severity: 'MEDIUM',
          confidence: 92,
          distance: 18.2,
          latitude: 26.7291,
          longitude: 88.3975,
          imageUrl: SAMPLE_IMAGES[3],
          timestamp: new Date(Date.now() - 2700000).toISOString(),
          status: 'REVIEWED'
        },
        {
          id: 'det-103',
          deviceId: 'ESP32-ROAD-002',
          type: 'POTHOLE',
          severity: 'HIGH',
          confidence: 94,
          distance: 49.8,
          latitude: 26.7322,
          longitude: 88.4012,
          imageUrl: SAMPLE_IMAGES[1],
          timestamp: new Date(Date.now() - 7200000).toISOString(),
          status: 'ACTIVE'
        },
        {
          id: 'det-104',
          deviceId: 'ESP32-ROAD-001',
          type: 'POTHOLE',
          severity: 'LOW',
          confidence: 88,
          distance: 41.5,
          latitude: 26.7250,
          longitude: 88.3920,
          imageUrl: SAMPLE_IMAGES[2],
          timestamp: new Date(Date.now() - 18000000).toISOString(),
          status: 'REPAIRED'
        }
      ];

      // Main SmartRoad AI Application Component
      function App() {
        const [activeTab, setActiveTab] = useState('dashboard');
        const [demoMode, setDemoMode] = useState(true);
        const [detections, setDetections] = useState(INITIAL_DETECTIONS);
        const [devices, setDevices] = useState(INITIAL_DEVICES);
        const [selectedDetection, setSelectedDetection] = useState(null);
        const [lastAction, setLastAction] = useState(null);

        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        });

        const stats = useMemo(() => {
          const today = new Date().toISOString().split('T')[0];
          const activeDevs = devices.filter(d => d.status === 'ONLINE').length;
          return {
            totalDetections: detections.length,
            totalPotholes: detections.filter(d => d.type === 'POTHOLE').length,
            totalBumps: detections.filter(d => d.type === 'ROAD_BUMP').length,
            todayDetections: detections.filter(d => d.timestamp.startsWith(today)).length,
            criticalDetections: detections.filter(d => d.severity === 'CRITICAL' || d.severity === 'HIGH').length,
            activeDevices: activeDevs,
            systemStatus: activeDevs > 0 ? 'ONLINE' : 'DEGRADED'
          };
        }, [detections, devices]);

        const simulatePothole = () => {
          const baseLat = 26.7271 + (Math.random() - 0.5) * 0.02;
          const baseLng = 88.3953 + (Math.random() - 0.5) * 0.02;
          const distance = Number((48 + Math.random() * 25).toFixed(1));
          const newId = `det-${Date.now()}`;
          const newDet = {
            id: newId,
            deviceId: 'ESP32-ROAD-001',
            type: 'POTHOLE',
            severity: distance > 60 ? 'CRITICAL' : 'HIGH',
            confidence: Math.floor(Math.random() * 8) + 92,
            distance,
            latitude: Number(baseLat.toFixed(5)),
            longitude: Number(baseLng.toFixed(5)),
            imageUrl: SAMPLE_IMAGES[Math.floor(Math.random() * SAMPLE_IMAGES.length)],
            timestamp: new Date().toISOString(),
            status: 'ACTIVE'
          };
          setDetections(prev => [newDet, ...prev]);
          setLastAction(`Simulated Pothole (${distance}cm) logged at [${newDet.latitude}, ${newDet.longitude}]`);
        };

        const simulateBump = () => {
          const baseLat = 26.7271 + (Math.random() - 0.5) * 0.02;
          const baseLng = 88.3953 + (Math.random() - 0.5) * 0.02;
          const distance = Number((10 + Math.random() * 12).toFixed(1));
          const newId = `det-${Date.now()}`;
          const newDet = {
            id: newId,
            deviceId: 'ESP32-ROAD-001',
            type: 'ROAD_BUMP',
            severity: distance < 14 ? 'HIGH' : 'MEDIUM',
            confidence: Math.floor(Math.random() * 10) + 88,
            distance,
            latitude: Number(baseLat.toFixed(5)),
            longitude: Number(baseLng.toFixed(5)),
            imageUrl: SAMPLE_IMAGES[3],
            timestamp: new Date().toISOString(),
            status: 'ACTIVE'
          };
          setDetections(prev => [newDet, ...prev]);
          setLastAction(`Simulated Road Bump (${distance}cm elevation) logged`);
        };

        const moveGps = () => {
          setDevices(prev => prev.map(d => {
            if (d.deviceId === 'ESP32-ROAD-001') {
              const newLat = Number((d.latitude + (Math.random() - 0.48) * 0.003).toFixed(5));
              const newLng = Number((d.longitude + (Math.random() - 0.48) * 0.003).toFixed(5));
              setLastAction(`ESP32-ROAD-001 moved to [${newLat}, ${newLng}]`);
              return { ...d, latitude: newLat, longitude: newLng, lastSeen: new Date().toISOString() };
            }
            return d;
          }));
        };

        const exportCSV = () => {
          const headers = ['ID', 'Device ID', 'Type', 'Severity', 'Distance(cm)', 'Latitude', 'Longitude', 'Timestamp'];
          const rows = detections.map(d => [d.id, d.deviceId, d.type, d.severity, d.distance, d.latitude, d.longitude, d.timestamp]);
          const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
          const encodedUri = encodeURI(csvContent);
          const link = document.createElement('a');
          link.setAttribute('href', encodedUri);
          link.setAttribute('download', `smartroad_detections_${new Date().toISOString().split('T')[0]}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };

        return (
          <div className="flex min-h-screen bg-[#0B0F19] text-slate-100 font-sans">
            {/* Sidebar */}
            <aside className="hidden lg:flex flex-col w-64 bg-[#0F172A]/80 backdrop-blur-xl border-r border-slate-800 min-h-screen sticky top-0 z-40 select-none">
              <div className="p-5 border-b border-slate-800 flex items-center space-x-3">
                <div className="p-2.5 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-500 shadow-glow-cyan">
                  <i data-lucide="radio" className="w-6 h-6 text-white animate-pulse"></i>
                </div>
                <div>
                  <h1 className="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-cyan-400 bg-clip-text text-transparent">
                    SmartRoad <span className="text-cyan-400">AI</span>
                  </h1>
                  <p className="text-[10px] uppercase font-mono tracking-widest text-cyan-400 font-semibold">IoT Road Detection</p>
                </div>
              </div>

              {/* Demo Mode Toggle */}
              <div className="mx-4 my-3 p-3 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-between">
                <div className="flex items-center space-x-2">
                  <span className={`w-2.5 h-2.5 rounded-full ${demoMode ? 'bg-emerald-400 animate-pulse' : 'bg-slate-500'}`} />
                  <span className="text-xs font-medium text-slate-300">Demo Simulation</span>
                </div>
                <button
                  onClick={() => setDemoMode(!demoMode)}
                  className={`relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors ${demoMode ? 'bg-cyan-500' : 'bg-slate-700'}`}
                >
                  <span className={`pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white transition ${demoMode ? 'translate-x-4' : 'translate-x-0'}`} />
                </button>
              </div>

              {/* Navigation Items */}
              <nav className="flex-1 px-3 py-2 space-y-1">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                  { id: 'live', label: 'Live Telemetry', icon: 'activity' },
                  { id: 'camera', label: 'Live Camera', icon: 'camera' },
                  { id: 'map', label: 'Road Map', icon: 'map-pin' },
                  { id: 'history', label: 'Detection History', icon: 'history' },
                  { id: 'devices', label: 'IoT Devices', icon: 'cpu' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center px-3 py-2.5 rounded-xl text-xs font-medium transition-all ${
                      activeTab === item.id
                        ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 font-semibold shadow-glow-cyan'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                    }`}
                  >
                    <i data-lucide={item.icon} className="w-4 h-4 mr-3"></i>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>

              <div className="p-4 border-t border-slate-800 bg-slate-950/40 text-xs font-mono text-slate-400">
                <div className="flex items-center space-x-2">
                  <div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                  <span>ESP32 Telemetry Active</span>
                </div>
              </div>
            </aside>

            {/* Main Area */}
            <div className="flex-1 flex flex-col min-w-0">
              {/* Header */}
              <header className="bg-[#0F172A]/70 backdrop-blur-xl border-b border-slate-800 sticky top-0 z-30 px-6 py-3 flex items-center justify-between">
                <div>
                  <h2 className="text-sm font-semibold text-slate-100 flex items-center gap-2">
                    <span>Welcome, Chief Operator</span>
                    <span className="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                      ADMIN
                    </span>
                  </h2>
                  <p className="text-xs text-slate-400 font-mono mt-0.5">
                    {new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}
                    <span className="text-cyan-400 font-bold ml-2">{new Date().toLocaleTimeString()}</span>
                  </p>
                </div>

                <div className="flex items-center space-x-4">
                  <div className="hidden sm:flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-xs font-mono">
                    <span className={`w-2.5 h-2.5 rounded-full ${stats.systemStatus === 'ONLINE' ? 'bg-emerald-400 status-dot-pulse' : 'bg-red-500'}`} />
                    <span>SYSTEM {stats.systemStatus}</span>
                  </div>

                  <button onClick={exportCSV} className="px-3 py-1.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs shadow-glow-cyan transition-all flex items-center space-x-1">
                    <i data-lucide="download" className="w-3.5 h-3.5"></i>
                    <span>Export CSV</span>
                  </button>
                </div>
              </header>

              {/* Demo Action Controller Bar */}
              {demoMode && (
                <div className="bg-slate-900/90 border-b border-cyan-500/30 px-6 py-2.5 flex flex-wrap items-center justify-between gap-3 text-xs">
                  <div className="flex items-center space-x-2">
                    <i data-lucide="zap" className="w-4 h-4 text-cyan-400 animate-bounce"></i>
                    <span className="font-bold text-slate-100">Live Hardware Simulation Engine</span>
                  </div>

                  <div className="flex items-center space-x-2">
                    <button onClick={simulatePothole} className="px-3 py-1.5 rounded-xl bg-red-500/20 text-red-300 border border-red-500/40 font-semibold hover:bg-red-500/30 transition shadow-glow-danger flex items-center space-x-1">
                      <i data-lucide="alert-circle" className="w-3.5 h-3.5"></i>
                      <span>Simulate Pothole</span>
                    </button>

                    <button onClick={simulateBump} className="px-3 py-1.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/40 font-semibold hover:bg-amber-500/30 transition shadow-glow-warning flex items-center space-x-1">
                      <i data-lucide="activity" className="w-3.5 h-3.5"></i>
                      <span>Simulate Road Bump</span>
                    </button>

                    <button onClick={moveGps} className="px-3 py-1.5 rounded-xl bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 font-semibold hover:bg-cyan-500/30 transition shadow-glow-cyan flex items-center space-x-1">
                      <i data-lucide="navigation" className="w-3.5 h-3.5"></i>
                      <span>Move GPS</span>
                    </button>
                  </div>

                  {lastAction && (
                    <span className="text-[11px] text-emerald-400 font-mono bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">
                      {lastAction}
                    </span>
                  )}
                </div>
              )}

              {/* Main Content View */}
              <main className="flex-1 p-6 space-y-6 overflow-y-auto">
                {activeTab === 'dashboard' && (
                  <div className="space-y-6">
                    {/* KPI Cards */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4">
                      <div className="p-4 rounded-2xl glass-card border border-slate-800 shadow-glow-danger">
                        <span className="text-[11px] font-semibold text-slate-400 block">TOTAL POTHOLES</span>
                        <span className="text-3xl font-extrabold text-red-400 font-mono mt-1 block">{stats.totalPotholes}</span>
                        <span className="text-[10px] text-slate-400 mt-1 block">Detected road cavities</span>
                      </div>

                      <div className="p-4 rounded-2xl glass-card border border-slate-800 shadow-glow-warning">
                        <span className="text-[11px] font-semibold text-slate-400 block">TOTAL BUMPS</span>
                        <span className="text-3xl font-extrabold text-amber-400 font-mono mt-1 block">{stats.totalBumps}</span>
                        <span className="text-[10px] text-slate-400 mt-1 block">Road elevations</span>
                      </div>

                      <div className="p-4 rounded-2xl glass-card border border-slate-800 shadow-glow-cyan">
                        <span className="text-[11px] font-semibold text-slate-400 block">TODAY'S LOGS</span>
                        <span className="text-3xl font-extrabold text-cyan-400 font-mono mt-1 block">{stats.todayDetections}</span>
                        <span className="text-[10px] text-slate-400 mt-1 block">Recorded last 24h</span>
                      </div>

                      <div className="p-4 rounded-2xl glass-card border border-slate-800">
                        <span className="text-[11px] font-semibold text-slate-400 block">CRITICAL HAZARDS</span>
                        <span className="text-3xl font-extrabold text-purple-400 font-mono mt-1 block">{stats.criticalDetections}</span>
                        <span className="text-[10px] text-slate-400 mt-1 block">High severity potholes</span>
                      </div>

                      <div className="p-4 rounded-2xl glass-card border border-slate-800">
                        <span className="text-[11px] font-semibold text-slate-400 block">ACTIVE DEVICES</span>
                        <span className="text-3xl font-extrabold text-emerald-400 font-mono mt-1 block">{stats.activeDevices}</span>
                        <span className="text-[10px] text-slate-400 mt-1 block">ESP32 units connected</span>
                      </div>

                      <div className="p-4 rounded-2xl glass-card border border-slate-800">
                        <span className="text-[11px] font-semibold text-slate-400 block">SYSTEM STATUS</span>
                        <span className="text-3xl font-extrabold text-cyan-400 font-mono mt-1 block">{stats.systemStatus}</span>
                        <span className="text-[10px] text-slate-400 mt-1 block">Stream active</span>
                      </div>
                    </div>

                    {/* Telemetry & GIS Map Grid */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                      <div className="p-5 rounded-2xl glass-card border border-slate-800 space-y-3">
                        <div className="flex justify-between items-center">
                          <h3 className="text-sm font-bold text-slate-100 flex items-center gap-2">
                            <i data-lucide="activity" className="w-4 h-4 text-cyan-400"></i>
                            Live Ultrasonic Telemetry Stream
                          </h3>
                          <span className="text-xs font-mono text-cyan-400 font-bold">45° Ultrasonic Array</span>
                        </div>
                        <div className="h-64 bg-slate-950/80 rounded-xl border border-slate-800 p-4 flex flex-col justify-between">
                          <div className="flex justify-between text-xs font-mono">
                            <span className="text-slate-400">Baseline Surface: 32.4 cm</span>
                            <span className="text-emerald-400 font-bold">Signal Normal</span>
                          </div>
                          <div className="text-center py-6">
                            <span className="text-4xl font-extrabold text-cyan-400 font-mono glow-text-cyan">32.4 cm</span>
                            <p className="text-xs text-slate-400 font-mono mt-1">Real-time Road Clearance Measurement</p>
                          </div>
                          <div className="flex justify-between text-[11px] font-mono text-slate-500">
                            <span>Pothole Threshold: &gt; 45 cm</span>
                            <span>Bump Threshold: &lt; 20 cm</span>
                          </div>
                        </div>
                      </div>

                      {/* Map Container */}
                      <div className="p-5 rounded-2xl glass-card border border-slate-800 space-y-3">
                        <div className="flex justify-between items-center">
                          <h3 className="text-sm font-bold text-slate-100 flex items-center gap-2">
                            <i data-lucide="map-pin" className="w-4 h-4 text-cyan-400"></i>
                            Live Geographic Pothole Map
                          </h3>
                          <button onClick={() => setActiveTab('map')} className="text-xs text-cyan-400 hover:underline">Full View →</button>
                        </div>
                        <div id="leaflet-map" className="h-64 rounded-xl border border-slate-800"></div>
                      </div>
                    </div>

                    {/* Hazard Activity Feed Table */}
                    <div className="p-5 rounded-2xl glass-card border border-slate-800 space-y-4">
                      <div className="flex justify-between items-center">
                        <h3 className="text-sm font-bold text-slate-100">Live Hazard Activity Log</h3>
                        <button onClick={() => setActiveTab('history')} className="text-xs text-cyan-400 hover:underline">View All →</button>
                      </div>

                      <div className="overflow-x-auto">
                        <table className="w-full text-xs text-left">
                          <thead className="bg-slate-900 text-slate-400 font-mono uppercase">
                            <tr>
                              <th className="py-2.5 px-3">Type</th>
                              <th className="py-2.5 px-3">Severity</th>
                              <th className="py-2.5 px-3">Distance</th>
                              <th className="py-2.5 px-3">Device</th>
                              <th className="py-2.5 px-3">GPS Location</th>
                              <th className="py-2.5 px-3">Time</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800 font-mono">
                            {detections.map(det => (
                              <tr key={det.id} onClick={() => setSelectedDetection(det)} className="hover:bg-slate-800/40 cursor-pointer">
                                <td className="py-2.5 px-3">
                                  <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${det.type === 'POTHOLE' ? 'bg-red-500/20 text-red-400' : 'bg-amber-500/20 text-amber-400'}`}>
                                    {det.type}
                                  </span>
                                </td>
                                <td className="py-2.5 px-3 font-bold text-red-400">{det.severity}</td>
                                <td className="py-2.5 px-3 text-cyan-400 font-bold">{det.distance} cm</td>
                                <td className="py-2.5 px-3 text-slate-300">{det.deviceId}</td>
                                <td className="py-2.5 px-3 text-slate-400">[{det.latitude}, {det.longitude}]</td>
                                <td className="py-2.5 px-3 text-slate-400">{new Date(det.timestamp).toLocaleTimeString()}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'map' && (
                  <div className="space-y-4">
                    <h2 className="text-xl font-extrabold text-slate-100 flex items-center gap-2">
                      <i data-lucide="map-pin" className="w-5 h-5 text-cyan-400"></i>
                      Interactive Geographic Road Condition Map
                    </h2>
                    <div id="leaflet-map-full" className="h-[75vh] rounded-2xl border border-slate-800"></div>
                  </div>
                )}

                {activeTab === 'camera' && (
                  <div className="space-y-6">
                    <h2 className="text-xl font-extrabold text-slate-100 flex items-center gap-2">
                      <i data-lucide="camera" className="w-5 h-5 text-cyan-400"></i>
                      ESP32-CAM Live Vision Feed & Snapshot Gallery
                    </h2>
                    <div className="p-5 rounded-2xl glass-card border border-slate-800 space-y-4">
                      <div className="aspect-video w-full rounded-xl overflow-hidden relative bg-slate-950 border border-slate-800">
                        <img src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=1200&q=80" className="w-full h-full object-cover" />
                        <div className="absolute top-3 left-3 bg-slate-950/80 px-3 py-1.5 rounded text-[11px] font-mono text-cyan-400">
                          <span className="text-red-500 font-bold mr-2">● LIVE REC</span> RES: 1280x720 HD
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'history' && (
                  <div className="space-y-4">
                    <div className="flex justify-between items-center">
                      <h2 className="text-xl font-extrabold text-slate-100 flex items-center gap-2">
                        <i data-lucide="history" className="w-5 h-5 text-cyan-400"></i>
                        Detection Audit Log & History
                      </h2>
                      <button onClick={exportCSV} className="px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 font-bold text-xs shadow-glow-cyan">
                        Export CSV
                      </button>
                    </div>
                    <div className="p-5 rounded-2xl glass-card border border-slate-800">
                      <table className="w-full text-xs text-left font-mono">
                        <thead className="bg-slate-900 text-slate-400 uppercase">
                          <tr>
                            <th className="py-3 px-4">ID</th>
                            <th className="py-3 px-4">Type</th>
                            <th className="py-3 px-4">Severity</th>
                            <th className="py-3 px-4">Distance</th>
                            <th className="py-3 px-4">Device</th>
                            <th className="py-3 px-4">Timestamp</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800">
                          {detections.map(d => (
                            <tr key={d.id} className="hover:bg-slate-800/40">
                              <td className="py-3 px-4 text-slate-400">{d.id}</td>
                              <td className="py-3 px-4 font-bold text-cyan-400">{d.type}</td>
                              <td className="py-3 px-4 font-bold text-red-400">{d.severity}</td>
                              <td className="py-3 px-4">{d.distance} cm</td>
                              <td className="py-3 px-4 text-slate-300">{d.deviceId}</td>
                              <td className="py-3 px-4 text-slate-400">{new Date(d.timestamp).toLocaleString()}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {activeTab === 'devices' && (
                  <div className="space-y-4">
                    <h2 className="text-xl font-extrabold text-slate-100 flex items-center gap-2">
                      <i data-lucide="cpu" className="w-5 h-5 text-cyan-400"></i>
                      ESP32 Hardware Inventory
                    </h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {devices.map(dev => (
                        <div key={dev.id} className="p-5 rounded-2xl glass-card border border-slate-800 space-y-3">
                          <div className="flex justify-between items-center">
                            <h3 className="font-bold text-slate-100 text-sm">{dev.name}</h3>
                            <span className="px-2 py-0.5 rounded text-[10px] font-mono bg-emerald-500/10 text-emerald-400 font-bold">{dev.status}</span>
                          </div>
                          <p className="text-xs text-cyan-400 font-mono">{dev.deviceId}</p>
                          <div className="grid grid-cols-2 gap-2 text-[11px] font-mono bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                            <div>Battery: <b>{dev.batteryLevel}%</b></div>
                            <div>WiFi: <b>{dev.wifiSignal}%</b></div>
                            <div>GPS: <b className="text-emerald-400">{dev.gpsStatus}</b></div>
                            <div>Cam: <b className="text-emerald-400">{dev.cameraStatus}</b></div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </main>
            </div>

            {/* Modal Detail Dialog */}
            {selectedDetection && (
              <div onClick={() => setSelectedDetection(null)} className="fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center p-4">
                <div onClick={e => e.stopPropagation()} className="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 shadow-2xl">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 className="font-extrabold text-sm text-cyan-400 uppercase">{selectedDetection.type} DETAILED REPORT</h3>
                    <button onClick={() => setSelectedDetection(null)} className="text-slate-400 hover:text-white">✕</button>
                  </div>
                  <img src={selectedDetection.imageUrl} className="w-full h-48 object-cover rounded-xl border border-slate-800" />
                  <div className="grid grid-cols-2 gap-3 text-xs font-mono bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <div><span className="text-slate-500 block">Severity:</span> <span className="font-bold text-red-400">{selectedDetection.severity}</span></div>
                    <div><span className="text-slate-500 block">Distance:</span> <span className="font-bold text-cyan-400">{selectedDetection.distance} cm</span></div>
                    <div><span className="text-slate-500 block">Device ID:</span> <span className="text-slate-200">{selectedDetection.deviceId}</span></div>
                    <div><span className="text-slate-500 block">Location:</span> <span className="text-slate-200">[{selectedDetection.latitude}, {selectedDetection.longitude}]</span></div>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);

      // Initialize Leaflet Map once DOM is attached
      setTimeout(() => {
        const mapEl = document.getElementById('leaflet-map') || document.getElementById('leaflet-map-full');
        if (mapEl && window.L && !mapEl._leaflet_id) {
          const map = L.map(mapEl).setView([26.7271, 88.3953], 14);
          L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
          }).addTo(map);

          INITIAL_DETECTIONS.forEach(det => {
            const color = det.type === 'POTHOLE' ? '#EF4444' : '#F59E0B';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="${color}" width="28" height="28" stroke="#0F172A"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`;
            const icon = L.divIcon({ className: 'custom-leaflet-marker', html: svg, iconSize: [28, 28], iconAnchor: [14, 28] });
            L.marker([det.latitude, det.longitude], { icon }).addTo(map).bindPopup(`
              <div class="p-1 text-xs font-mono">
                <b style="color: ${color}">${det.type}</b><br/>
                Depth: ${det.distance}cm<br/>
                Device: ${det.deviceId}
              </div>
            `);
          });
        }
      }, 500);
    </script>
  </body>
</html>
